# Encoding
set-environment -g LANG en_US.UTF-8
set-environment -g LC_ALL en_US.UTF-8

# Prefix
set -g prefix C-t

# Hides inactive windows
# set -g window-status-format ''
# set -g window-status-current-format ' #W '
set -g window-status-separator ''


# Display
set -g set-titles off
set -g pane-border-format '#{pane_index}'
set -g status-left '[#S] '
set -g status-right ''
setw -g automatic-rename off
# set -g status-style 'bg=green,fg=black'

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Default 'logs' session: created once on server start, with note windows.
# To add another note window, add a `new-window` line inside the block.
if-shell '! tmux has-session -t logs 2>/dev/null' { \
  new-session -d -s logs -n work-log     -c ~/me/notes 'nvim work-log.md' ; \
  new-window  -d -t logs -n personal-log -c ~/me/notes 'nvim personal-log.md' \
  new-window  -d -t logs -n papers -c ~/me/notes 'nvim papers.md' \
}

# New windows/splits keep the current pane's path
bind c new-window -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind T split-window -f -l 15 -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation
# Prefix+w is tmux's built-in session/window tree.
# C-s stays reserved for the global last-window jump.
unbind-key -n C-w
bind w choose-tree -Zw -F '#{?pane_format,#{pane_index}: #{pane_current_command},#{?window_format,#{window_index}: #{window_name}#{window_flags},#{session_name}: #{session_windows} windows#{?session_attached, (attached),}}}'

# Global last-window: tracks session:window across sessions
set-hook -g after-select-window    "run-shell 'sh ~/.config/tmux/tmux-last-window.sh track'"
set-hook -g client-session-changed "run-shell 'sh ~/.config/tmux/tmux-last-window.sh track'"
bind -n C-s run-shell "sh ~/.config/tmux/tmux-last-window.sh jump"

# Mouse
set -g mouse on

# Copy mode (vi)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
set -g set-clipboard on
set -g set-clipboard off
if-shell 'test "$(uname -s)" = Darwin' 'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' 'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -i -selection clipboard"'

# SSH agent
set -g update-environment "SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_C"

# Quick nav
bind f send-keys "gt ~/workspace/" Enter
bind -n M-1 switch-client -t logs:work-log
bind -n M-2 switch-client -t logs:personal-log
bind -n C-= switch-client -t sre:shell

# Pi
set -g extended-keys on
set -g extended-keys-format csi-u
